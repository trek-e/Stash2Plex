name: Tests

on:
  push:
    branches:
      - main
      - v1.x.x
  pull_request:
    branches:
      - main
      - v1.x.x

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is what the feederbox826/stash-s6 container actually ships,
        # so it is the version most users run the plugin on.
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest
