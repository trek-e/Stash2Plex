name: Release

on:
  push:
    tags:
      - 'v1.5.*'
      - 'v1.6.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine release branch
        id: branch
        run: |
          git fetch origin v1.x.x main
          if git branch -r --contains HEAD | grep -q 'origin/v1\.x\.x'; then
            echo "name=v1.x.x" >> "$GITHUB_OUTPUT"
          else
            echo "name=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Switch to release branch
        run: git checkout ${{ steps.branch.outputs.name }}

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Update Stash2Plex.yml version
        run: |
          sed -i "s/^version: .*/version: ${{ steps.version.outputs.version }}/" Stash2Plex.yml

      - name: Build plugin zip
        run: |
          cat > BUILD_INFO.txt <<EOF
          branch: ${{ steps.branch.outputs.name }}
          commit: $(git rev-parse HEAD)
          tag: ${GITHUB_REF_NAME}
          build_time_utc: $(date -u +"%Y-%m-%d %H:%M:%S")
          EOF
          rm -f Stash2Plex.zip
          zip -r Stash2Plex.zip \
            Stash2Plex.py Stash2Plex.yml requirements.txt BUILD_INFO.txt \
            worker/ sync_queue/ plex/ validation/ shared/ shared_lib/ hooks/ reconciliation/ \
            -x '*/test*' '*/__pycache__/*' '*.pyc' '*/.pytest*'

      - name: Verify plugin zip matches manifest
        run: |
          ALLOWED="BUILD_INFO.txt Stash2Plex.py Stash2Plex.yml requirements.txt worker sync_queue plex validation shared shared_lib hooks reconciliation"

          TOP_LEVEL=$(unzip -Z1 Stash2Plex.zip | awk -F/ '{print $1}' | sort -u)

          UNEXPECTED=""
          for entry in $TOP_LEVEL; do
            found=0
            for allowed in $ALLOWED; do
              if [ "$entry" = "$allowed" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -eq 0 ]; then
              UNEXPECTED="$UNEXPECTED $entry"
            fi
          done

          MISSING=""
          for allowed in $ALLOWED; do
            found=0
            for entry in $TOP_LEVEL; do
              if [ "$entry" = "$allowed" ]; then
                found=1
                break
              fi
            done
            if [ "$found" -eq 0 ]; then
              MISSING="$MISSING $allowed"
            fi
          done

          if [ -n "$UNEXPECTED" ]; then
            echo "::error::Stash2Plex.zip contains entries not in the manifest:$UNEXPECTED"
          fi
          if [ -n "$MISSING" ]; then
            echo "::error::Stash2Plex.zip is missing expected manifest entries:$MISSING"
          fi
          if [ -n "$UNEXPECTED" ] || [ -n "$MISSING" ]; then
            exit 1
          fi

          COUNT=$(unzip -Z1 Stash2Plex.zip | wc -l | tr -d ' ')
          SIZE=$(du -h Stash2Plex.zip | cut -f1)
          echo "Stash2Plex.zip OK: $COUNT entries, $SIZE"

      - name: Update index.yml
        run: |
          SHA=$(sha256sum Stash2Plex.zip | awk '{print $1}')
          DATE=$(date -u +"%Y-%m-%d %H:%M:%S")
          VERSION="${{ steps.version.outputs.version }}"
          SOURCE_BRANCH="${{ steps.branch.outputs.name }}"
          SOURCE_COMMIT=$(git rev-parse HEAD)
          sed -i "s/^  version: .*/  version: ${VERSION}/" index.yml
          sed -i "s/^  date: .*/  date: \"${DATE}\"/" index.yml
          sed -i "s|^  path: .*|  path: Stash2Plex.zip|" index.yml
          sed -i "s/^  sha256: .*/  sha256: ${SHA}/" index.yml
          sed -i "s/^  source_branch: .*/  source_branch: \"${SOURCE_BRANCH}\"/" index.yml
          sed -i "s/^  source_commit: .*/  source_commit: \"${SOURCE_COMMIT}\"/" index.yml

      - name: Commit updated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Stash2Plex.yml index.yml Stash2Plex.zip
          git commit -m "chore: update plugin index and zip for v${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ steps.branch.outputs.name }}

      - name: Mirror index.yml and zip to main
        run: |
          BRANCH_COMMIT=$(git rev-parse HEAD)
          git fetch origin main
          git checkout origin/main -b _main_mirror
          git checkout "$BRANCH_COMMIT" -- index.yml Stash2Plex.yml Stash2Plex.zip
          git commit -m "chore: update plugin index and zip for v${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${GITHUB_REF_NAME}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:"- %s" "${PREV_TAG}..${GITHUB_REF_NAME}" -- '*.py' '*.yml' ':!tests/' ':!.github/' | grep -v "^- chore:" || true)
          fi
          if [ -z "$NOTES" ]; then
            NOTES="- Bug fixes and improvements"
          fi
          {
            echo "body<<EOF"
            echo "### Changes"
            echo ""
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "v${{ steps.version.outputs.version }}"
          body: ${{ steps.notes.outputs.body }}
          files: Stash2Plex.zip
